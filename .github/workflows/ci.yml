name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Run lint script
        run: |
          echo "Validating the code..."
          ./scripts/lint.sh

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Run tests
        run: |
          echo "Running tests..."
          ./tests/test.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          ./scripts/build.sh
